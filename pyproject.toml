[project]
name = "trade-analytics"
version = "0.1.0"
description = "Statistical analysis of a discretionary trading record: expectancy, inference, Bayesian skill assessment, Monte Carlo drawdown risk and position sizing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.scripts]
trade-journal = "trade_analytics.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
